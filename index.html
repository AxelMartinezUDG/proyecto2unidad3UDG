<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Residencial Los Robles - Plataforma Comunitaria</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Icon Wrapper Helper for Lucide Icons
    const Icon = ({ name, size = 20, className = "" }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} style={{ width: size, height: size }} class={`inline-block ${className}`}></i>;
    };

    function App() {
      const [activeTab, setActiveTab] = useState('inicio');
      const [resident, setResident] = useState({
        name: "Otón Damian Romero",
        house: "Casa #42",
        status: "Al día",
        discountPoints: 120
      });

      const [showEmergencyModal, setShowEmergencyModal] = useState(false);

      const [payments, setPayments] = useState([
        { id: 1, month: "Febrero 2026", amount: 1500, status: "Pagado", date: "2026-02-05", receipt: "REC-0024" },
        { id: 2, month: "Enero 2026", amount: 1500, status: "Pagado", date: "2026-01-04", receipt: "REC-0012" },
      ]);
      const [showReceiptModal, setShowReceiptModal] = useState(false);

      const [votes, setVotes] = useState([
        {
          id: 1,
          title: "Instalación de Paneles Solares en Casa Club",
          description: "Se propone el uso de energía limpia para reducir la cuota de mantenimiento general.",
          options: [
            { id: 'a', label: "Sí, autorizar presupuesto", votes: 24 },
            { id: 'b', label: "No, mantener estado actual", votes: 8 },
            { id: 'c', label: "Revisar más cotizaciones", votes: 5 }
          ],
          userVoted: null,
          totalVotes: 37
        },
        {
          id: 2,
          title: "Horario de Ruido y Fiestas en Fin de Semana",
          description: "Ajustar el horario límite de sonido alto los sábados de 2:00 AM a 12:00 AM.",
          options: [
            { id: 'a', label: "Límite 12:00 AM", votes: 19 },
            { id: 'b', label: "Límite 1:00 AM", votes: 12 },
            { id: 'c', label: "Mantener 2:00 AM", votes: 6 }
          ],
          userVoted: 'a',
          totalVotes: 37
        }
      ]);

      const [reports, setReports] = useState([
        { id: 101, title: "Luminaria fundida en Calle Los Robles Ote.", category: "Alumbrado", status: "En Proceso", assignedTo: "Mantenimiento - Carlos R.", date: "2026-02-20", photo: "https://images.unsplash.com/photo-1509114397022-ed747cca3f65?w=300&auto=format&fit=crop&q=60" },
        { id: 102, title: "Portón de acceso principal ruidoso", category: "Seguridad", status: "Resuelto", assignedTo: "Técnico Portones", date: "2026-02-15", photo: null }
      ]);
      const [newReport, setNewReport] = useState({ title: '', category: 'Alumbrado', description: '', photo: null });

      const [notices, setNotices] = useState([
        { id: 1, title: "Mantenimiento Programado de Alberca", date: "25 Feb 2026", text: "La alberca permanecerá cerrada por supercloración el próximo jueves de 8:00 a 16:00 hrs.", category: "Mantenimiento", read: false },
        { id: 2, title: "Asamblea General Ordinaria", date: "20 Feb 2026", text: "Se convoca a todos los residentes a la asamblea anual en el salón social el 1 de marzo.", category: "Comunidad", read: true }
      ]);

      const handleVote = (voteId, optionId) => {
        setVotes(votes.map(v => {
          if (v.id === voteId && !v.userVoted) {
            const updatedOptions = v.options.map(opt => opt.id === optionId ? { ...opt, votes: opt.votes + 1 } : opt);
            return { ...v, options: updatedOptions, userVoted: optionId, totalVotes: v.totalVotes + 1 };
          }
          return v;
        }));
      };

      const handleCreateReport = (e) => {
        e.preventDefault();
        if (!newReport.title) return;
        const created = {
          id: Date.now(),
          title: newReport.title,
          category: newReport.category,
          status: "Pendiente",
          assignedTo: "Mesa Directiva",
          date: new Date().toISOString().split('T')[0],
          photo: newReport.photo
        };
        setReports([created, ...reports]);
        setNewReport({ title: '', category: 'Alumbrado', description: '', photo: null });
        alert("¡Reporte enviado con éxito! Se le ha asignado el número #" + created.id);
      };

      const markNoticeRead = (id) => {
        setNotices(notices.map(n => n.id === id ? { ...n, read: true } : n));
      };

      return (
        <div class="min-h-screen flex flex-col bg-slate-100">
          
          {/* TOP NAVBAR */}
          <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
              <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 p-2 rounded-lg">
                  <Icon name="trees" size={28} className="text-emerald-100" />
                </div>
                <div>
                  <h1 class="font-bold text-xl tracking-wide">Residencial Los Robles</h1>
                  <p class="text-xs text-emerald-200">Plataforma de Gestión Comunitaria</p>
                </div>
              </div>

              {/* Botón de Emergencia Destacado */}
              <button 
                onClick={() => setShowEmergencyModal(true)}
                class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-full shadow-lg transition flex items-center space-x-2 animate-pulse"
              >
                <Icon name="alert-triangle" size={18} />
                <span class="hidden md:inline">EMERGENCIA</span>
              </button>
            </div>
          </header>

          {/* BARRA DE NAVEGACIÓN Y PERFIL DE RESIDENTE */}
          <section class="bg-white border-b border-slate-200 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-800 flex items-center justify-center font-bold">
                  MS
                </div>
                <div>
                  <span class="font-semibold text-slate-800 block">{resident.name} ({resident.house})</span>
                  <span class="text-xs bg-emerald-100 text-emerald-800 font-medium px-2 py-0.5 rounded-full">Estatus: {resident.status}</span>
                </div>
              </div>

              {/* Tabs / Menú Principal */}
              <nav class="flex space-x-1 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
                {[
                  { id: 'inicio', label: 'Inicio', icon: 'home' },
                  { id: 'pagos', label: 'Pagos y Finanzas', icon: 'credit-card' },
                  { id: 'votaciones', label: 'Votaciones', icon: 'vote' },
                  { id: 'reportes', label: 'Reportes y Quejas', icon: 'wrench' },
                  { id: 'avisos', label: 'Avisos', icon: 'bell' },
                  { id: 'directorio', label: 'Directorio', icon: 'phone-call' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    class={`flex items-center space-x-2 px-3 py-2 rounded-lg text-sm font-medium transition whitespace-nowrap ${
                      activeTab === tab.id 
                        ? 'bg-emerald-700 text-white shadow-sm' 
                        : 'text-slate-600 hover:bg-slate-100'
                    }`}
                  >
                    <Icon name={tab.icon} size={16} />
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>
            </div>
          </section>

          {/* CONTENIDO PRINCIPAL */}
          <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

            {/* TAB: INICIO / DASHBOARD */}
            {activeTab === 'inicio' && (
              <div class="space-y-6">
                {/* Banner de Bienvenida */}
                <div class="bg-gradient-to-r from-emerald-700 to-teal-800 rounded-2xl p-6 text-white shadow-md">
                  <h2 class="text-2xl font-bold mb-2">¡Bienvenido a la comunidad, {resident.name}!</h2>
                  <p class="text-emerald-100 max-w-2xl text-sm">
                    Mantente al día con tus mantenimientos, participa en las votaciones activas de la colonia y consulta avisos importantes de la mesa directiva.
                  </p>
                  <div class="mt-4 flex flex-wrap gap-4">
                    <div class="bg-white/10 backdrop-blur-md px-4 py-2 rounded-lg border border-white/20">
                      <span class="text-xs text-emerald-200 block">Cuota mensual</span>
                      <span class="text-lg font-bold">$1,500 MXN</span>
                    </div>
                    <div class="bg-white/10 backdrop-blur-md px-4 py-2 rounded-lg border border-white/20">
                      <span class="text-xs text-emerald-200 block">Puntos por Pago Puntual</span>
                      <span class="text-lg font-bold">{resident.discountPoints} pts (Cupones activos)</span>
                    </div>
                  </div>
                </div>

                {/* Resumen en Cuadrícula */}
                <div class="grid md:grid-cols-3 gap-6">
                  {/* Resumen de Avisos */}
                  <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div>
                      <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-slate-800 flex items-center gap-2">
                          <Icon name="bell" className="text-emerald-600" /> Últimos Avisos
                        </h3>
                        <span class="text-xs bg-red-100 text-red-700 font-semibold px-2 py-0.5 rounded-full">
                          {notices.filter(n => !n.read).length} nuevos
                        </span>
                      </div>
                      <ul class="space-y-3 text-sm">
                        {notices.slice(0, 2).map(n => (
                          <li key={n.id} class="border-b border-slate-100 pb-2">
                            <span class="font-medium text-slate-700 block">{n.title}</span>
                            <span class="text-xs text-slate-400">{n.date}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                    <button onClick={() => setActiveTab('avisos')} class="mt-4 text-emerald-700 hover:text-emerald-800 text-xs font-semibold flex items-center gap-1">
                      Ver todos los avisos <Icon name="arrow-right" size={14} />
                    </button>
                  </div>

                  {/* Votación Activa */}
                  <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div>
                      <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-slate-800 flex items-center gap-2">
                          <Icon name="vote" className="text-emerald-600" /> Votación en Curso
                        </h3>
                        <span class="text-xs bg-blue-100 text-blue-700 font-semibold px-2 py-0.5 rounded-full">Activa</span>
                      </div>
                      <p class="text-sm font-semibold text-slate-700 mb-2">{votes[0].title}</p>
                      <p class="text-xs text-slate-500 line-clamp-2">{votes[0].description}</p>
                    </div>
                    <button onClick={() => setActiveTab('votaciones')} class="mt-4 bg-emerald-700 text-white py-2 rounded-lg text-xs font-semibold hover:bg-emerald-800 transition">
                      Participar en Votación
                    </button>
                  </div>

                  {/* Estado de Cuenta */}
                  <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div>
                      <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-slate-800 flex items-center gap-2">
                          <Icon name="check-circle" className="text-emerald-600" /> Estatus Financiero
                        </h3>
                        <span class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2 py-0.5 rounded-full">Sin Adeudos</span>
                      </div>
                      <p class="text-sm text-slate-600 mb-1">Último pago registrado:</p>
                      <p class="text-base font-bold text-slate-800">Febrero 2026 - $1,500 MXN</p>
                      <p class="text-xs text-slate-400">Recibo: REC-0024</p>
                    </div>
                    <button onClick={() => setActiveTab('pagos')} class="mt-4 text-emerald-700 hover:text-emerald-800 text-xs font-semibold flex items-center gap-1">
                      Ver historial y comprobantes <Icon name="arrow-right" size={14} />
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: GESTIÓN DE PAGOS Y FINANZAS */}
            {activeTab === 'pagos' && (
              <div class="space-y-6">
                <div class="flex justify-between items-center">
                  <div>
                    <h2 class="text-2xl font-bold text-slate-800">Gestión de Pagos y Transparencia</h2>
                    <p class="text-sm text-slate-500">Consulta tu historial, realiza pagos en línea y descarga estados financieros comunitarios.</p>
                  </div>
                  <button 
                    onClick={() => setShowReceiptModal(true)}
                    class="bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow-sm flex items-center gap-2"
                  >
                    <Icon name="plus-circle" size={18} /> Registrar Pago en Línea
                  </button>
                </div>

                <div class="grid md:grid-cols-3 gap-6">
                  {/* Tarjeta de Historial de Pagos */}
                  <div class="md:col-span-2 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <h3 class="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2">
                      <Icon name="history" className="text-emerald-600" /> Historial Personal de Pagos
                    </h3>
                    <div class="overflow-x-auto">
                      <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-50 text-slate-700 uppercase text-xs">
                          <tr>
                            <th class="p-3">Concepto / Mes</th>
                            <th class="p-3">Monto</th>
                            <th class="p-3">Fecha</th>
                            <th class="p-3">Estatus</th>
                            <th class="p-3">Comprobante</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                          {payments.map(p => (
                            <tr key={p.id}>
                              <td class="p-3 font-semibold text-slate-800">{p.month}</td>
                              <td class="p-3">${p.amount} MXN</td>
                              <td class="p-3">{p.date}</td>
                              <td class="p-3">
                                <span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full text-xs font-semibold">
                                  {p.status}
                                </span>
                              </td>
                              <td class="p-3">
                                <button class="text-emerald-700 hover:underline text-xs flex items-center gap-1 font-medium">
                                  <Icon name="download" size={14} /> PDF ({p.receipt})
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  {/* Panel Lateral: Transparencia y Beneficios */}
                  <div class="space-y-6">
                    {/* Estados Financieros */}
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <h4 class="font-bold text-slate-800 mb-2 flex items-center gap-2">
                        <Icon name="file-text" className="text-emerald-600" /> Transparencia Total
                      </h4>
                      <p class="text-xs text-slate-500 mb-4">Descarga los estados financieros mensuales aprobados por la mesa directiva.</p>
                      <div class="space-y-2">
                        {["Estado_Financiero_Ene_2026.pdf", "Estado_Financiero_Dic_2025.pdf"].map((doc, idx) => (
                          <div key={idx} class="flex items-center justify-between p-2 bg-slate-50 rounded-lg text-xs">
                            <span class="truncate font-medium text-slate-700">{doc}</span>
                            <button class="text-emerald-700 font-bold hover:underline">Descargar</button>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Beneficios por Pago Puntual */}
                    <div class="bg-amber-50 p-5 rounded-xl border border-amber-200 shadow-sm">
                      <h4 class="font-bold text-amber-900 mb-2 flex items-center gap-2">
                        <Icon name="award" className="text-amber-600" /> Beneficios Pago Puntual
                      </h4>
                      <p class="text-xs text-amber-800 mb-3">
                        ¡Tienes <strong>{resident.discountPoints} puntos</strong>! Canjéalos por reservas prioritarias en la Casa Club o cupones locales.
                      </p>
                      <button class="w-full bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold py-2 rounded-lg transition">
                        Reservar Asador / Casa Club
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: VOTACIONES DIGITALES */}
            {activeTab === 'votaciones' && (
              <div class="space-y-6 max-w-4xl mx-auto">
                <div>
                  <h2 class="text-2xl font-bold text-slate-800">Sistema de Votaciones Digitales</h2>
                  <p class="text-sm text-slate-500">Participa de forma segura. Tu voto está ligado de manera transparente e individual a la residencia <strong>{resident.house}</strong>.</p>
                </div>

                <div class="space-y-6">
                  {votes.map(vote => (
                    <div key={vote.id} class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                      <div class="flex justify-between items-start mb-3">
                        <h3 class="font-bold text-lg text-slate-800">{vote.title}</h3>
                        {vote.userVoted ? (
                          <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1">
                            <Icon name="check" size={14} /> Ya votaste
                          </span>
                        ) : (
                          <span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full">
                            Pendiente de voto
                          </span>
                        )}
                      </div>
                      <p class="text-sm text-slate-600 mb-4">{vote.description}</p>

                      {/* Opciones de Voto */}
                      <div class="space-y-3">
                        {vote.options.map(opt => {
                          const percentage = Math.round((opt.votes / vote.totalVotes) * 100) || 0;
                          const isSelected = vote.userVoted === opt.id;

                          return (
                            <div key={opt.id} class="border border-slate-200 rounded-lg p-3 relative overflow-hidden">
                              {/* Barra de Progreso de fondo */}
                              <div 
                                class={`absolute top-0 left-0 bottom-0 transition-all duration-500 ${isSelected ? 'bg-emerald-100' : 'bg-slate-100'}`}
                                style={{ width: `${percentage}%`, zIndex: 0 }}
                              ></div>

                              <div class="relative z-10 flex justify-between items-center">
                                <span class="text-sm font-medium text-slate-800 flex items-center gap-2">
                                  {isSelected && <Icon name="check-circle" size={16} className="text-emerald-600" />}
                                  {opt.label}
                                </span>
                                <div class="flex items-center gap-3">
                                  <span class="text-xs font-bold text-slate-600">{percentage}% ({opt.votes} votos)</span>
                                  {!vote.userVoted && (
                                    <button 
                                      onClick={() => handleVote(vote.id, opt.id)}
                                      class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs px-3 py-1.5 rounded-md font-semibold transition"
                                    >
                                      Votar
                                    </button>
                                  )}
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>

                      <div class="mt-4 text-xs text-slate-400 text-right">
                        Total de residentes participantes: {vote.totalVotes}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: REPORTES Y QUEJAS */}
            {activeTab === 'reportes' && (
              <div class="grid md:grid-cols-3 gap-6">
                {/* Formulario para Nuevo Reporte */}
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm h-fit">
                  <h3 class="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2">
                    <Icon name="plus-circle" className="text-emerald-600" /> Crear Nuevo Reporte
                  </h3>
                  <form onSubmit={handleCreateReport} class="space-y-4">
                    <div>
                      <label class="block text-xs font-semibold text-slate-700 mb-1">Título del problema</label>
                      <input 
                        type="text" 
                        required
                        placeholder="Ej. Fuga de agua en área verde" 
                        class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none"
                        value={newReport.title}
                        onChange={(e) => setNewReport({...newReport, title: e.target.value})}
                      />
                    </div>

                    <div>
                      <label class="block text-xs font-semibold text-slate-700 mb-1">Categoría</label>
                      <select 
                        class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none"
                        value={newReport.category}
                        onChange={(e) => setNewReport({...newReport, category: e.target.value})}
                      >
                        <option value="Alumbrado">Alumbrado público</option>
                        <option value="Seguridad">Seguridad / Control acceso</option>
                        <option value="Mantenimiento">Mantenimiento general</option>
                        <option value="Limpieza">Limpieza y Jardinería</option>
                        <option value="Convivencia">Vecinos / Ruido</option>
                      </select>
                    </div>

                    <div>
                      <label class="block text-xs font-semibold text-slate-700 mb-1">Descripción detallada</label>
                      <textarea 
                        rows="3" 
                        placeholder="Menciona la ubicación exacta y detalles..." 
                        class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none"
                      ></textarea>
                    </div>

                    <div>
                      <label class="block text-xs font-semibold text-slate-700 mb-1">Evidencia Fotográfica (Opcional)</label>
                      <input type="file" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100" />
                    </div>

                    <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 rounded-lg text-sm transition">
                      Enviar Reporte a Administración
                    </button>
                  </form>
                </div>

                {/* Lista y Seguimiento de Reportes */}
                <div class="md:col-span-2 space-y-4">
                  <h3 class="font-bold text-lg text-slate-800 flex items-center gap-2">
                    <Icon name="list-checks" className="text-emerald-600" /> Seguimiento de Incidencias
                  </h3>

                  <div class="space-y-4">
                    {reports.map(rep => (
                      <div key={rep.id} class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-4 justify-between">
                        <div class="space-y-2 flex-grow">
                          <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-slate-400">#{rep.id}</span>
                            <span class="text-xs bg-slate-100 text-slate-700 font-semibold px-2 py-0.5 rounded-full">{rep.category}</span>
                            <span class={`text-xs font-bold px-2 py-0.5 rounded-full ${
                              rep.status === 'Resuelto' ? 'bg-emerald-100 text-emerald-800' :
                              rep.status === 'En Proceso' ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800'
                            }`}>
                              {rep.status}
                            </span>
                          </div>
                          <h4 class="font-bold text-slate-800">{rep.title}</h4>
                          <p class="text-xs text-slate-500">Asignado a: <strong>{rep.assignedTo}</strong> | Fecha: {rep.date}</p>
                        </div>

                        {rep.photo && (
                          <img src={rep.photo} alt="Evidencia" class="w-24 h-24 object-cover rounded-lg border border-slate-200" />
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB: NOTIFICACIONES MASIVAS Y AVISOS */}
            {activeTab === 'avisos' && (
              <div class="space-y-6 max-w-4xl mx-auto">
                <div class="flex justify-between items-center">
                  <div>
                    <h2 class="text-2xl font-bold text-slate-800">Panel Digital de Avisos</h2>
                    <p class="text-sm text-slate-500">Comunicados oficiales de la administración y la mesa directiva.</p>
                  </div>
                </div>

                <div class="space-y-4">
                  {notices.map(notice => (
                    <div 
                      key={notice.id} 
                      class={`p-5 rounded-xl border transition shadow-sm ${
                        notice.read ? 'bg-white border-slate-200' : 'bg-emerald-50/50 border-emerald-300'
                      }`}
                    >
                      <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center gap-2">
                          <span class="text-xs bg-emerald-700 text-white font-semibold px-2 py-0.5 rounded-md">
                            {notice.category}
                          </span>
                          <span class="text-xs text-slate-400">{notice.date}</span>
                        </div>
                        {!notice.read && (
                          <button 
                            onClick={() => markNoticeRead(notice.id)}
                            class="text-xs bg-emerald-200 text-emerald-800 font-semibold px-2.5 py-1 rounded-full hover:bg-emerald-300"
                          >
                            Confirmar Lectura
                          </button>
                        )}
                      </div>

                      <h3 class="font-bold text-slate-800 text-lg mb-1">{notice.title}</h3>
                      <p class="text-sm text-slate-600">{notice.text}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: DIRECTORIO DE CONTACTO Y SERVICIOS */}
            {activeTab === 'directorio' && (
              <div class="space-y-6 max-w-4xl mx-auto">
                <div>
                  <h2 class="text-2xl font-bold text-slate-800">Directorio de Servicios y Administración</h2>
                  <p class="text-sm text-slate-500">Números telefónicos de asistencia rápida y atención a residentes.</p>
                </div>

                <div class="grid md:grid-cols-2 gap-4">
                  {[
                    { title: "Caseta de Vigilancia Principal", phone: "+52 (55) 5555-0191", desc: "Acceso 24/7 y control de visitas", icon: "shield" },
                    { title: "Administración Central", phone: "+52 (55) 5555-0192", desc: "Horario de atención: Lunes a Viernes 9:00 - 18:00 hrs", icon: "building" },
                    { title: "Servicios de Mantenimiento", phone: "+52 (55) 5555-0193", desc: "Reporte directo de averías en áreas comunes", icon: "wrench" },
                    { title: "Mesa Directiva", phone: "+52 (55) 5555-0194", desc: "Contacto directo con el presidente de colonia", icon: "users" },
                  ].map((item, idx) => (
                    <div key={idx} class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-4">
                      <div class="p-3 bg-emerald-100 text-emerald-800 rounded-lg">
                        <Icon name={item.icon} size={24} />
                      </div>
                      <div>
                        <h4 class="font-bold text-slate-800">{item.title}</h4>
                        <p class="text-xs text-slate-500 mb-1">{item.desc}</p>
                        <a href={`tel:${item.phone}`} class="text-sm font-bold text-emerald-700 hover:underline flex items-center gap-1">
                          <Icon name="phone" size={14} /> {item.phone}
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* MODAL: BOTÓN DE EMERGENCIA */}
          {showEmergencyModal && (
            <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 text-center">
                <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto animate-bounce">
                  <Icon name="alert-triangle" size={36} />
                </div>
                <h3 class="text-2xl font-bold text-slate-900">Centro de Emergencias</h3>
                <p class="text-sm text-slate-600">
                  Haz clic para llamar inmediatamente a la Caseta de Vigilancia o activar la alarma de alerta en la colonia.
                </p>

                <div class="space-y-3 pt-2">
                  <a 
                    href="tel:911" 
                    class="w-full block bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow-md transition"
                  >
                    Llamar al 911 (Emergencia General)
                  </a>
                  <a 
                    href="tel:5555550191" 
                    class="w-full block bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl transition"
                  >
                    Llamar a Caseta Los Robles
                  </a>
                </div>

                <button 
                  onClick={() => setShowEmergencyModal(false)}
                  class="mt-4 text-xs font-semibold text-slate-400 hover:text-slate-600 underline"
                >
                  Cerrar Ventana
                </button>
              </div>
            </div>
          )}

          {/* MODAL: REGISTRAR PAGO */}
          {showReceiptModal && (
            <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <h3 class="text-xl font-bold text-slate-800">Registrar Pago en Línea</h3>
                <form class="space-y-3" onSubmit={(e) => { e.preventDefault(); setShowReceiptModal(false); alert("Pago registrado en revisión por administración."); }}>
                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Mes a pagar</label>
                    <select class="w-full text-sm border border-slate-300 rounded-lg p-2.5 outline-none">
                      <option>Marzo 2026 - $1,500 MXN</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Método de Pago</label>
                    <select class="w-full text-sm border border-slate-300 rounded-lg p-2.5 outline-none">
                      <option>Tarjeta de Crédito / Débito</option>
                      <option>Transferencia SPEI</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Adjuntar Comprobante</label>
                    <input type="file" class="w-full text-xs text-slate-500" />
                  </div>
                  <div class="pt-2 flex gap-2">
                    <button type="button" onClick={() => setShowReceiptModal(false)} class="w-1/2 border border-slate-300 text-slate-700 py-2 rounded-lg text-sm font-semibold">Cancelar</button>
                    <button type="submit" class="w-1/2 bg-emerald-700 text-white py-2 rounded-lg text-sm font-semibold hover:bg-emerald-800">Pagar $1,500 MXN</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer class="bg-slate-800 text-slate-400 text-xs py-6 border-t border-slate-700">
            <div class="max-w-7xl mx-auto px-4 text-center space-y-2">
              <p>Colonia Residencial Los Robles &copy; 2026 - Todos los derechos reservados.</p>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
